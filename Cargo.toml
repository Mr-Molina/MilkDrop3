[workspace]
resolver = "2"
members = [
    "crates/md-eval",
    "crates/md-preset",
    "crates/md-analysis",
    "crates/md-audio",
    "crates/md-hlsl",
    "crates/md-text",
    "crates/md-render",
    "crates/md-core",
    "crates/md-platform",
    "apps/milkdrop",
    "tests/support/md-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
wgpu = "30.0.1"
naga = "30.0.1"
winit = "0.30.13"
cpal = "0.18.2"
fontdue = "0.9.5"
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
ddsfile = "0.6.0"
glam = "0.34.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
hound = "3.5.1"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand_pcg = "0.10.2"
rand_core = "0.10.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
dirs = "7.0.0"
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSString", "NSObject"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "SCError", "SCShareableContent", "SCStream", "block2", "dispatch2", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMSampleBuffer", "CMBlockBuffer", "CMFormatDescription", "CMTime", "CMBase", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
proptest = { version = "1.12.0", default-features = false, features = ["std", "handle-panics"] }
