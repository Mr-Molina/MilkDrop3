[workspace]
resolver = "2"
members = [
    "crates/md-eval",
    "crates/md-preset",
    "crates/md-analysis",
    "crates/md-audio",
    "crates/md-hlsl",
    "crates/md-text",
    "crates/md-render",
    "crates/md-core",
    "crates/md-platform",
    "apps/milkdrop",
    "tests/support/md-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
wgpu = "30.0.1"
naga = "30.0.1"
winit = "0.30.13"
cpal = "0.18.2"
fontdue = "0.9.5"
fontdb = "0.24.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ddsfile = "0.6.0"
glam = "0.34.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
hound = "3.5.1"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rand_pcg = "0.10.2"
rand_core = "0.10.1"
thiserror = "2.0.21"
anyhow = "1.0.104"
dirs = "7.0.0"
libpulse-binding = "2.30.1"
screencapturekit = "11.1.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
