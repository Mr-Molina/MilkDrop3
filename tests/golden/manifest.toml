# Presets used for golden captures.
#
# - tests/golden/windows/: one-off visual references captured from the C++ build
#   (procedure in tests/golden/windows/README.md).
# - tests/golden/rust/: the Rust renderer's own committed baselines, one PNG per
#   preset and frame (`rust/<dir>/<name>/frame_<n>.png`), checked by
#   apps/milkdrop/tests/golden_suite.rs (Task 6.9). The suite covers the whole
#   corpus under tests/presets/ and fails if a corpus preset is missing here.
#
# `path` is relative to tests/presets/. Values in [defaults] apply to every
# entry unless the entry overrides them.
#
# `driver` names what produced the baselines. "static" is the Task 5.8 headless
# driver: no per-frame/per-pixel/per-point equations run, each enabled custom
# shape is drawn once from its preset-file values, custom waves are empty. The
# baselines are PROVISIONAL until Task 7.9 replaces the driver with
# md_core::Visualizer: flip every entry to "visualizer", re-bless, re-inspect.
#
# Baselines are 320x240 to keep committed binary churn small; pixel-exact
# behaviour is pinned by the md-render unit and GPU tests.

[defaults]
width = 320
height = 240
seed = 7
frames = [1, 60, 300]
max_dssim = 0.02

[[preset]]
path = "classic/bass_kaleido.milk"
covers = ["MilkDrop 1", "motion vectors (bMotionVectorsOn), sqr/sqrt/abs/pow/equal/sign in per-pixel"]
driver = "static"

[[preset]]
path = "classic/drift_tunnel.milk"
covers = ["PSVERSION 0", "per-frame + per-pixel motion"]
driver = "static"

